name: Release

# A tag v<version> is a release of the commit it names. Everything CI does is
# done again there (ci.yml, called from here), and what that built is
# published as a GitHub release: the demos for both platforms and the two
# wheels, with a checksum of each. Its notes are the tag's annotation, in
# Markdown below its subject line, written to a file first so that git's own
# cleanup does not take the "## " headings for comments:
#
#   git tag -a --cleanup=whitespace -F notes.md v0.1.0
#   git push origin v0.1.0
#
# Nothing goes to PyPI or crates.io. The wheels and crates are ready for
# them -- CI builds the one and packages the other on every commit -- but a
# version uploaded there is that version for good, and that is a decision of
# its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The version is written in three places, and a tag that names another
  # would publish the libraries under a number they do not say they are.
  version:
    name: The tag is the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare them
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake="$(sed -n 's/^project(plotcore VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          python="$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)"
          rust="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' rust/Cargo.toml)"
          echo "tag $tag; CMakeLists.txt $cmake, python/pyproject.toml $python, rust/Cargo.toml $rust"
          if [ "$cmake" != "$tag" ] || [ "$python" != "$tag" ] || [ "$rust" != "$tag" ]; then
            echo "::error::$GITHUB_REF_NAME is not the version the sources say they are"
            exit 1
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  # Each demo as one download -- an AppImage as it is, a Windows folder
  # zipped with the folder in it -- beside the two wheels and a checksum of
  # every file.
  github:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # checkout fetches the commit a tag names and writes the tag back as a
      # lightweight one, without the annotation the notes are.
      - name: Fetch the tag itself
        run: git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/download-artifact@v7
        with:
          pattern: plotcore-*-demo-*
          path: artefacts

      - uses: actions/download-artifact@v7
        with:
          pattern: plotcore-python-*
          path: release
          merge-multiple: true

      - name: Put it together
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv artefacts/plotcore-*-demo-Linux/*.AppImage release/
          for demo in qt egui pyqt6; do
            mv "artefacts/plotcore-$demo-demo-Windows" "artefacts/plotcore-$demo-demo"
            (cd artefacts && zip -q -r -9 "../release/plotcore-$demo-demo-$version-windows-x86_64.zip" "plotcore-$demo-demo")
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "plotcore ${GITHUB_REF_NAME#v}" --notes-file notes.md
