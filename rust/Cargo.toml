# plotcore for Rust: the C interface compiled in (plotcore-sys), a safe
# wrapper over it (plotcore), the same figure in egui (plotcore-egui), and an
# example that walks every feature on one window (egui-demo).
#
# plotcore-sys compiles the C++ core and the C interface with the cc crate,
# through links to cpp/ and c/ that cargo follows when it packages it, so a
# packaged crate carries those sources and could be published. None is: the
# crates are used from this repository, as a git dependency on a release's
# tag (README.md).

[workspace]
resolver = "2"
members = ["plotcore-sys", "plotcore", "plotcore-egui", "egui-demo"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
authors = ["Jonas Sattler", "Andreas Martin"]
repository = "https://github.com/jonassattler/plotcore"
readme = "README.md"

[workspace.dependencies]
# A version beside each path, because a packaged crate names its
# dependencies by version: the same as [workspace.package]'s, or nothing here
# builds.
plotcore-sys = { path = "plotcore-sys", version = "0.2.1" }
plotcore = { path = "plotcore", version = "0.2.1" }
plotcore-egui = { path = "plotcore-egui", version = "0.2.1" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# The core is the hot path even in a debug build; a ten-million-sample line
# folded at -O0 is a slow first frame for nothing.
opt-level = 1
